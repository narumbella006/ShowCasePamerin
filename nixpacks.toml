[phases.setup]
# Harus PHP 8.4, bukan 8.3. composer.lock dibuat di mesin dengan PHP 8.4
# sehingga mengunci Symfony 8.1.x yang mensyaratkan php >= 8.4.1. Menurunkan
# ke 8.3 membuat `composer install` gagal memverifikasi lock file.
nixPkgs = ["php84", "php84Packages.composer", "nodejs_20"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci"
]

[phases.build]
cmds = [
    "npm run build"
]

[start]
# storage:link dijalankan tiap start (bukan cuma sekali) karena symlink-nya
# ada di public/ yang ikut ter-rebuild tiap deploy, sedangkan target-nya
# (storage/app/public) ada di Railway Volume yang persistent.
cmd = "php artisan migrate --force && (php artisan storage:link || true) && php artisan config:cache && php artisan serve --host 0.0.0.0 --port $PORT"
